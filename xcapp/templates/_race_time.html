{# A race result's time, its pace per mile, and its time adjusted for the day's course and weather. Needs r, adj. #}
<b>{{ fmt_time(r.time_s) }}</b><br><span class="small muted">{{ fmt_time((r.time_s / (r.distance_m / 1609.344))|round)[:-2] }}/mi</span>{% if adj and not adj_apart %}<br><span class="small adj" title="Adjusted: what this effort would be on a track at 55°F or cooler, at sea level, with a low dew point">Adj. {{ fmt_time(adj) }}</span>{% endif %}
