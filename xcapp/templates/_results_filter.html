{# Filters for a results list: `action` is the page the form goes to; `used` the filters in use. #}
<form method="get" action="{{ action }}" class="form-row" style="margin-bottom:10px">
  <label>Team<select name="gender"><option value="">Everyone</option>{% for g in ('Boys', 'Girls') %}<option{% if used.gender == g %} selected{% endif %}>{{ g }}</option>{% endfor %}</select></label>
  <label>Athlete<select name="athlete"><option value="">All</option>{% for a in athletes %}<option value="{{ a.id }}"{% if used.athlete == a.id|string %} selected{% endif %}>{{ a.name }}</option>{% endfor %}</select></label>
  <label>Event<select name="event"><option value="">All</option>{% for e in events %}<option{% if used.event == e %} selected{% endif %}>{{ e }}</option>{% endfor %}</select></label>
  <label>Season<select name="season"><option value="">All</option>{% for s in seasons %}<option{% if used.season == s %} selected{% endif %}>{{ s }}</option>{% endfor %}</select></label>
  <label>Type<select name="kind"><option value="">All</option>{% for k in kinds %}<option{% if used.kind == k %} selected{% endif %}>{{ k }}</option>{% endfor %}</select></label>
  <button type="submit" class="secondary">Filter</button>
  {% if used %}<a href="{{ action }}">Clear</a>{% endif %}
</form>
