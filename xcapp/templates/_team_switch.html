{# Boys / Girls buttons beside a page title: `base` is the page, `extra` any other query to keep, `with_all` adds an All button. #}
<nav class="form-row team-switch" aria-label="Boys or girls">
  {% for t in (('Boys', 'Girls', 'All') if with_all is defined and with_all else ('Boys', 'Girls')) %}<a class="button{% if t != team %} secondary{% endif %}" href="{{ base }}?team={{ t }}{{ extra or '' }}"{% if t == team %} aria-current="page"{% endif %}>{{ t }}</a>{% endfor %}
</nav>
