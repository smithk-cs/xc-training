# Tests every change; deploys main to Cloudflare once the secrets in DEPLOY.md are set.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: xc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (Postgres, like Supabase)
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/xc_test
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests (Cloudflare Worker)
        run: npm run test:worker

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the secrets
        id: ready
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GARMIN_WEBHOOK_SECRET: ${{ secrets.GARMIN_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare is not set up yet (no CLOUDFLARE_API_TOKEN secret), so nothing was deployed. See DEPLOY.md."
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for name in CLOUDFLARE_ACCOUNT_ID DATABASE_URL SECRET_KEY TOKEN_KEY GARMIN_WEBHOOK_SECRET CRON_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Add these GitHub secrets before deploying (see DEPLOY.md):$missing"
            exit 1
          fi
          case "$DATABASE_URL" in
            postgresql+psycopg://*) ;;
            *) echo "::error::DATABASE_URL must start with postgresql+psycopg:// (see DEPLOY.md)."; exit 1 ;;
          esac
          echo "go=true" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloudflare
        if: steps.ready.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          GARMIN_WEBHOOK_SECRET: ${{ secrets.GARMIN_WEBHOOK_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SETUP_CODE: ${{ secrets.SETUP_CODE }}
          GARMIN_CLIENT_ID: ${{ secrets.GARMIN_CLIENT_ID }}
          GARMIN_CLIENT_SECRET: ${{ secrets.GARMIN_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          umask 077
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          # Only secrets that are set; Cloudflare keeps earlier values for any left out.
          node -e '
            const names = ["DATABASE_URL", "SECRET_KEY", "TOKEN_KEY", "GARMIN_WEBHOOK_SECRET", "CRON_SECRET",
                           "SETUP_CODE", "GARMIN_CLIENT_ID", "GARMIN_CLIENT_SECRET", "ANTHROPIC_API_KEY"];
            const out = Object.fromEntries(names.filter((n) => process.env[n]).map((n) => [n, process.env[n]]));
            require("fs").writeFileSync(process.argv[1], JSON.stringify(out));
          ' "$secrets_file"
          npx wrangler deploy --secrets-file "$secrets_file"
